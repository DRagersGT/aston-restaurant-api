server.port=8083
# Настройки базы данных H2 (в памяти)
spring.datasource.url=jdbc:h2:mem:restaurantdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# Включаем консоль для просмотра БД (по желанию)
spring.h2.console.enabled=true
# Чтобы Spring выбрасывал исключение, если URL не найден
spring.mvc.throw-exception-if-no-handler-found=true
# Отключаем автоматический маппинг ресурсов (чтобы 404 срабатывал)
spring.web.resources.add-mappings=false